<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, initial-scale=1" />
  <link rel="stylesheet" href="news_post.css" />
  <title>BYCHEM News Instagram Post</title>
</head>
<body>
  <main id="post" class="post">
    <img id="background" class="background" alt="" />
    <div class="veil"></div>

    <div class="news-kicker">BYCHEM   |   News</div>
    <div class="news-date" id="news-date"></div>

    <header class="story">
      <h1 id="headline"></h1>
      <p id="summary"></p>
    </header>

    <figure class="print">
      <div class="print-window"><img id="photo" alt="" /></div>
    </figure>

    <img class="brand" src="../assets/logo_white.svg" alt="BYCHEM" />
  </main>

  <script>
    function fitText(element, start, minimum, maxLines) {
      const computed = getComputedStyle(element);
      const maxHeight = Number.parseFloat(computed.maxHeight);

      let size = start;
      element.style.fontSize = `${size}px`;

      while (
        Number.isFinite(maxHeight) &&
        element.scrollHeight > maxHeight + 1 &&
        size > minimum
      ) {
        size -= 2;
        element.style.fontSize = `${size}px`;
      }

      if (Number.isFinite(maxHeight) && element.scrollHeight > maxHeight + 1) {
        element.style.fontSize = `${minimum}px`;
        element.style.display = '-webkit-box';
        element.style.webkitBoxOrient = 'vertical';
        element.style.webkitLineClamp = String(maxLines);
        element.style.overflow = 'hidden';
      }
    }

    window.renderNewsPost = async ({ title, subtitle, imageUrl, orientation, dateLabel }) => {
      const post = document.querySelector('#post');
      const background = document.querySelector('#background');
      const photo = document.querySelector('#photo');
      const headline = document.querySelector('#headline');
      const summary = document.querySelector('#summary');
      const newsDate = document.querySelector('#news-date');

      post.classList.toggle('photo-landscape', orientation === 'landscape');
      post.classList.toggle('photo-portrait', orientation === 'portrait');

      background.src = imageUrl;
      photo.src = imageUrl;
      headline.textContent = title;
      summary.textContent = subtitle ? `"${subtitle}"` : '';
      summary.hidden = !subtitle;
      newsDate.textContent = dateLabel || '';

      await Promise.all([background.decode(), photo.decode(), document.fonts.ready]);
      fitText(headline, 88, 38, 3);
      if (subtitle) fitText(summary, 38, 22, 2);
    };
  </script>
</body>
</html>
